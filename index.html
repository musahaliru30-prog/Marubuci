/* PATCH 6: Update .quote-card-text for responsiveness and scrollability */
.quote-card-text {
  font-family: 'Newsreader', serif;

<script>
// PATCH 1: Mobile Highlight Fix
function setupHighlightToolbar(){
  if(hlAbortCtrl){hlAbortCtrl.abort();}
  hlAbortCtrl=new AbortController();
  const signal=hlAbortCtrl.signal;
  let hlTimer=null;

  function handleSelectionEnd(e){
    clearTimeout(hlTimer);
    hlTimer=setTimeout(()=>{
      const sel=window.getSelection();
      if(!sel||sel.isCollapsed||!sel.rangeCount){hideHighlightToolbar();return;}
      const text=sel.toString().trim();
      if(text.length<8){hideHighlightToolbar();return;}
      const wrap=document.getElementById('read-content-wrap');
      if(!wrap){hideHighlightToolbar();return;}
      const range=sel.getRangeAt(0);
      if(!wrap.contains(range.commonAncestorContainer)){hideHighlightToolbar();return;}

      _pendingText=text;
      _pendingRange=range.cloneRange();

      const rect=range.getBoundingClientRect();
      const tb=document.getElementById('highlight-toolbar');
      const cr=document.getElementById('hl-color-row');
      tb.style.visibility='hidden';
      cr.style.visibility='hidden';
      tb.classList.add('visible');
      cr.classList.add('visible');
      requestAnimationFrame(()=>{
        positionToolbar(rect);
        tb.style.visibility='';
        cr.style.visibility='';
      });
    }, e.type==='touchend' ? 300 : 80);
  }

  document.addEventListener('mouseup', handleSelectionEnd, {signal});
  document.addEventListener('touchend', handleSelectionEnd, {signal});

  let scTimer=null;
  document.addEventListener('selectionchange', ()=>{
    clearTimeout(scTimer);
    scTimer=setTimeout(()=>{
      const sel=window.getSelection();
      if(!sel||sel.isCollapsed||!sel.rangeCount){return;}
      const text=sel.toString().trim();
      if(text.length<8){hideHighlightToolbar();return;}
      const wrap=document.getElementById('read-content-wrap');
      if(!wrap)return;
      try{
        const range=sel.getRangeAt(0);
        if(!wrap.contains(range.commonAncestorContainer)){hideHighlightToolbar();return;}
        _pendingText=text;
        _pendingRange=range.cloneRange();
        const rect=range.getBoundingClientRect();
        const tb=document.getElementById('highlight-toolbar');
        const cr=document.getElementById('hl-color-row');
        tb.classList.add('visible');
        cr.classList.add('visible');
        requestAnimationFrame(()=>positionToolbar(rect));
      }catch(e){}
    }, 200);
  },{signal});

  document.addEventListener('mousedown',function(e){
    const tb=document.getElementById('highlight-toolbar');
    const cr=document.getElementById('hl-color-row');
    if(!tb.contains(e.target)&&!cr.contains(e.target)){
      const wrap=document.getElementById('read-content-wrap');
      if(wrap&&!wrap.contains(e.target)){
        hideHighlightToolbar();
      }
    }
  },{signal});

  document.addEventListener('touchstart',function(e){
    const tb=document.getElementById('highlight-toolbar');
    const cr=document.getElementById('hl-color-row');
    if(!tb.contains(e.target)&&!cr.contains(e.target)){
      setTimeout(()=>{
        const sel=window.getSelection();
        if(!sel||sel.isCollapsed)hideHighlightToolbar();
      },100);
    }
  },{signal});
}

// PATCH 2: Quote Card with QR Code
function downloadQuoteCard(){
  const canvas=document.getElementById('quote-canvas');
  canvas.width=1080;canvas.height=1080;
  const ctx=canvas.getContext('2d');
  const W=1080,H=1080;

  ctx.fillStyle='#F5EFE0';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(196,98,45,0.07)';ctx.lineWidth=1;
  for(let x=0;x<W+60;x+=60){for(let y=0;y<H+60;y+=60){
    ctx.beginPath();ctx.moveTo(x+30,y);ctx.lineTo(x+60,y+30);ctx.lineTo(x+30,y+60);ctx.lineTo(x,y+30);ctx.closePath();ctx.stroke();
  }}

  ctx.strokeStyle='rgba(196,98,45,0.25)';ctx.lineWidth=2;ctx.strokeRect(32,32,W-64,H-64);
  ctx.strokeStyle='rgba(196,98,45,0.12)';ctx.lineWidth=1;ctx.strokeRect(40,40,W-80,H-80);
  ctx.fillStyle='#C4622D';ctx.fillRect(32,32,W-64,5);
  ctx.fillStyle='rgba(196,98,45,0.6)';ctx.font='italic 28px Georgia,serif';ctx.textAlign='left';
  ctx.fillText('Marubuci',60,110);
  ctx.fillStyle='rgba(26,18,8,0.3)';ctx.font='400 18px sans-serif';
  ctx.fillText('— Haliru Ali Musa',ctx.measureText('Marubuci').width+72,110);
  ctx.fillStyle='rgba(196,98,45,0.4)';ctx.font='bold 140px Georgia,serif';ctx.textAlign='left';
  ctx.fillText('\u201C',54,260);

  const maxChars=activeQuoteText.length;
  let fontSize=maxChars<80?44:maxChars<160?36:maxChars<280?30:24;
  ctx.fillStyle='#1A1208';
  ctx.font=`italic ${fontSize}px Georgia,serif`;
  ctx.textAlign='left';

  const words=activeQuoteText.split(' ');
  const maxW=W-140;
  let line='';let lineY=300;const lineH=fontSize*1.55;
  const lines=[];
  words.forEach(word=>{
    const test=line+(line?' ':'')+word;
    if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=word;}
    else line=test;
  });
  if(line)lines.push(line);

  lines.forEach(l=>{ctx.fillText(l,70,lineY);lineY+=lineH;});
  ctx.fillStyle='rgba(196,98,45,0.25)';ctx.font=`bold 80px Georgia,serif`;
  ctx.fillText('\u201D',70+ctx.measureText(lines[lines.length-1]||'').width,lineY-lineH+20);

  const divY=Math.max(lineY+40,H-260);
  ctx.strokeStyle='rgba(196,98,45,0.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(70,divY);ctx.lineTo(W-70,divY);ctx.stroke();
  ctx.fillStyle='rgba(26,18,8,0.7)';ctx.font=`italic ${fontSize>30?26:22}px Georgia,serif`;
  ctx.textAlign='left';
  const byline=(currentWork?.title||'')+(currentWork?.title?' — ':'')+'Haliru Ali Musa';
  ctx.fillText(byline,70,divY+44);

  const workLink=workUrl(currentWork?.id||'');
  ctx.fillStyle='rgba(196,98,45,0.5)';ctx.font='400 18px monospace';ctx.textAlign='left';
  ctx.fillText(workLink,70,H-52);

  drawQROnCanvas(ctx,workLink,W-200,H-220,160);

  const a=document.createElement('a');a.download='quote-marubuci.png';a.href=canvas.toDataURL('image/png');a.click();
  showToast('Quote card downloaded!');
}

function drawQROnCanvas(ctx,url,x,y,size){
  if(typeof qrcode !== 'undefined'){
    try{
      const qr=qrcode(0,'M');qr.addData(url);qr.generate();
      const count=qr.getModuleCount();
      const cell=size/count;
      ctx.fillStyle='#1A1208';
      for(let r=0;r<count;r++){for(let c=0;c<count;c++){
        if(qr.isDark(r,c)){ctx.fillRect(x+c*cell,y+r*cell,cell,cell);}
      }}
      ctx.fillStyle='rgba(245,239,224,1)';
      const bgPad=8;
      ctx.globalCompositeOperation='destination-over';
      ctx.fillRect(x-bgPad,y-bgPad,size+bgPad*2,size+bgPad*2);
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='rgba(26,18,8,0.4)';ctx.font='14px sans-serif';ctx.textAlign='center';
      ctx.fillText('Scan to read',x+size/2,y+size+20);
    }catch(e){drawDecorativeQR(ctx,x,y,size);}
  } else {
    const script=document.createElement('script');
    script.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    script.onload=()=>showToast('QR ready — download again for QR code');
    document.head.appendChild(script);
    drawDecorativeQR(ctx,x,y,size);
  }
}

function drawDecorativeQR(ctx,x,y,size){
  ctx.strokeStyle='rgba(196,98,45,0.4)';ctx.lineWidth=1.5;
  ctx.strokeRect(x,y,size,size);
  [[x+6,y+6],[x+size-34,y+6],[x+6,y+size-34]].forEach(([cx,cy])=>{
    ctx.strokeRect(cx,cy,28,28);ctx.strokeRect(cx+6,cy+6,16,16);
    ctx.fillStyle='rgba(196,98,45,0.5)';ctx.fillRect(cx+10,cy+10,8,8);
  });
  ctx.fillStyle='rgba(196,98,45,0.3)';ctx.beginPath();
  ctx.moveTo(x+size/2,y+size/2-16);ctx.lineTo(x+size/2+16,y+size/2);
  ctx.lineTo(x+size/2,y+size/2+16);ctx.lineTo(x+size/2-16,y+size/2);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(26,18,8,0.35)';ctx.font='13px sans-serif';ctx.textAlign='center';
  ctx.fillText('marubuci.com',x+size/2,y+size+18);
}

// PATCH 4: hlShare() — remove character limit
function hlShare(){
  const text=_pendingText;
  _pendingText='';_pendingRange=null;
  hideHighlightToolbar();
  if(!text)return;
  activeQuoteText=text;
  document.getElementById('quote-card-text').textContent=activeQuoteText;
  document.getElementById('quote-card-byline').textContent=(currentWork?.title||'')+(currentWork?.title?' — ':'')+'Haliru Ali Musa';
  document.getElementById('quote-card-overlay').classList.add('open');
  window.getSelection().removeAllRanges();
}
</script>
